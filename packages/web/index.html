<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zest — data and security workbench</title>
    <meta
      name="description"
      content="Chain encoders, hashes, ciphers and analysers into a recipe. Everything runs in your browser; nothing is uploaded."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23202020'/%3E%3Ctext x='16' y='23' font-family='ui-monospace,monospace' font-size='20' font-weight='700' fill='%23fcfcfc' text-anchor='middle'%3Ez%3C/text%3E%3C/svg%3E"
    />
    <script>
      // Applied before first paint so the page never flashes the wrong theme.
      (() => {
        const stored = localStorage.getItem('zest-theme');
        const dark = stored ? stored === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
        if (dark) document.documentElement.classList.add('dark');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
